name: Deploy to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend
      - name: Test
        run: npm test
      - name: Configure Wrangler authentication
        run: |
          mkdir -p "$HOME/.config/.wrangler/config"
          printf '%s' "${{ secrets.WRANGLER_OAUTH_CONFIG_B64 }}" | base64 --decode > "$HOME/.config/.wrangler/config/default.toml"
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: a665c850fdb73311da8da1f1df6be202
